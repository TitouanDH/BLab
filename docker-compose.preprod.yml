# Pre-prod stack (branch dev), layered on docker-compose.yml through COMPOSE_FILE in the
# pre-prod .env. Same real database and devices as production, its own UI on port 8443.
# docs/adr/0002-preprod-shares-production-database.md

services:
  django:
    depends_on: !reset []
    networks:
      - backend
      - db

  # The Link and Switch workers run in pre-prod only, never in production's stack, so its
  # deploys remove them as orphans (docs/adr/0013-workers-in-preprod-only.md). They take
  # django's image and settings; each keeps its advisory lock, so two pre-prod containers
  # never work at once.
  # Tears down requested Links and removes BLab's own Orphans
  link_worker:
    extends:
      file: docker-compose.yml
      service: django
    command: ["python", "manage.py", "link_worker"]
    volumes: !override
      - ./api/logs:/app/logs
    depends_on: !reset []
    stop_grace_period: !reset null
    networks:
      - backend
      - db

  # Carries out the Cleanups that Releases ask for, Inspects and Quarantines
  switch_worker:
    extends:
      file: docker-compose.yml
      service: django
    command: ["python", "manage.py", "switch_worker"]
    volumes: !override
      - ./api/logs:/app/logs
      - ./api/aos_images:/app/aos_images  # AOS images downloaded once, kept for the next Cleanups (#48)
    depends_on: !reset []
    stop_grace_period: !reset null
    networks:
      - backend
      - db

  # Production runs the only expiry job and owns the database
  expiry:
    profiles: [production-only]
  db:
    profiles: [production-only]

  frontend:
    # HTTPS only: nginx's HTTP->HTTPS redirect drops the port and would land on production
    ports: !override
      - "8443:443"

networks:
  db:
    name: blab_db
    external: true
