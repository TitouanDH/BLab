name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      DB_ENGINE: sqlite3
      BLAB_DEVICES: fake
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the migration check compares against origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # same as api/Dockerfile
      - run: pip install -r requirements.txt
      - name: Models and migrations agree
        run: python manage.py makemigrations --check --dry-run
      - name: Migrations keep main working on the shared database
        run: python manage.py check_shared_db_migrations
      - run: python manage.py test api

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      # Browser tests against a mocked API (frontend/tests/mock-api.js): no server, no switch
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
